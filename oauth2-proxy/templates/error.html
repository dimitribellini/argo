{{define "error.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.StatusCode}} · Argo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --border-soft: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --subtle: #64748b;
      --badge-bg: #0f172a;
      --badge-fg: #ffffff;
      --btn-bg: #0f172a;
      --btn-hover: #1e293b;
      --btn-fg: #ffffff;
      --msg-bg: #f8fafc;
    }
    html.dark {
      --bg: #0f1218;
      --card: #161b24;
      --border: #2a3342;
      --border-soft: #232b38;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --subtle: #64748b;
      --badge-bg: #f1f5f9;
      --badge-fg: #0f172a;
      --btn-bg: #f1f5f9;
      --btn-hover: #e2e8f0;
      --btn-fg: #0f172a;
      --msg-bg: #1c2330;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--badge-bg);
      color: var(--badge-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .msg {
      margin: 0 0 18px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--msg-bg);
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      word-break: break-word;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--card);
    }
    .btn-primary {
      background: var(--btn-bg);
      border-color: var(--btn-bg);
      color: var(--btn-fg);
    }
    .btn-primary:hover {
      background: var(--btn-hover);
    }
    .req-id {
      margin-top: 16px;
      font-size: 11px;
      color: var(--subtle);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
  <script>
    (function () {
      try {
        var saved = window.localStorage.getItem("argo_theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">A</div>
      <strong>Argo</strong>
    </div>
    <h1>{{.StatusCode}} · {{.Title}}</h1>
    {{if .Message}}
    <p class="msg">{{.Message}}</p>
    {{end}}
    <div class="actions">
      <a class="btn btn-primary" href="{{.ProxyPrefix}}/sign_in">Sign in again</a>
      <a class="btn" href="{{if .Redirect}}{{.Redirect}}{{else}}/{{end}}">Return to Argo</a>
    </div>
    {{if .RequestID}}
    <div class="req-id">Request ID: {{.RequestID}}</div>
    {{end}}
  </main>
</body>
</html>
{{end}}
