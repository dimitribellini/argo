services:
  valkey:
    image: valkey/valkey:9.1-alpine
    mem_limit: 256m
    cpus: 0.5
    networks:
      - argo-core-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  argo-core:
    image: ghcr.io/dimitribellini/argo:latest
    mem_limit: 2g
    cpus: 2.0
    environment:
      # --- Required ---
      # Generate with: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      ARGO_MASTER_KEY: "${ARGO_MASTER_KEY:?Set ARGO_MASTER_KEY before starting Argo}"
      ARGO_PUBLIC_BASE_URL: "https://argo.example.com"

      # --- Optional Features (active by default; set "" / "false" if not needed) ---
      # Team & user isolation (Private | Team | Shared ACLs + Settings -> Users & Teams)
      ARGO_MULTI_USER: "true"
      # Single Google OAuth client for BOTH invite-only "Continue with Google" login AND 1-click Gmail/Drive/Calendar onboarding.
      # Leave "" for Email/Password-only; when set, add these 2 Authorized Redirect URIs in Google Cloud Console:
      #   - ${ARGO_PUBLIC_BASE_URL}/api/auth/google/callback
      #   - ${ARGO_PUBLIC_BASE_URL}/api/integrations/google/callback
      ARGO_GOOGLE_AUTH_CLIENT_ID: ""
      ARGO_GOOGLE_AUTH_CLIENT_SECRET: ""

      # --- Stack Defaults (no changes needed for standard hybrid deployments) ---
      ARGO_AUTH_MODE: "hybrid"
      ARGO_DB_PATH: "/data/argo.db"
      ARGO_SANDBOX_VOLUMES_ROOT: "/srv/argo/sandboxes"
      ARGO_SANDBOX_IMAGE: "ghcr.io/dimitribellini/argo-sandbox:latest"
      ARGO_SANDBOX_NETWORK: "argo-sandbox-net"
      ARGO_DOCKER_NETWORK: "argo-desktop-net"
      ARGO_REQUIRE_SSO: "true"
      # Uncomment only when using external SSO (--profile oauth2-proxy + ARGO_AUTH_MODE "sso"):
      # ARGO_TRUSTED_PROXY_HOST: "oauth2-proxy"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - argo-data:/data
      - /srv/argo/desktops:/srv/argo/desktops
      - /srv/argo/sandboxes:/srv/argo/sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - valkey
    networks:
      - argo-core-net
      - argo-desktop-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  oauth2-proxy:
    profiles: ["oauth2-proxy"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    mem_limit: 256m
    cpus: 0.5
    environment:
      OAUTH2_PROXY_CLIENT_ID: "CHANGE_ME_GOOGLE_CLIENT_ID"
      OAUTH2_PROXY_CLIENT_SECRET: "CHANGE_ME_GOOGLE_CLIENT_SECRET"
      OAUTH2_PROXY_COOKIE_SECRET: "CHANGE_ME_32_BYTE_COOKIE_SECRET"
      OAUTH2_PROXY_REDIRECT_URL: "https://argo.example.com/oauth2/callback"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
    command:
      - --provider=google
      - --http-address=0.0.0.0:4180
      - --upstream=http://argo-core:8000
      - --skip-auth-regex=^/(hooks/|favicon\.(svg|ico)$|apple-touch-icon\.png$)
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --custom-templates-dir=/etc/oauth2-proxy/templates
      - --footer=-
    volumes:
      - ./oauth2-proxy/templates:/etc/oauth2-proxy/templates:ro
    ports:
      - "127.0.0.1:4180:4180"
    depends_on:
      - argo-core
    networks:
      - argo-core-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  argo-core-net:
    name: argo-core-net
    driver: bridge
  argo-desktop-net:
    name: argo-desktop-net
    driver: bridge
  argo-sandbox-net:
    name: argo-sandbox-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  argo-data:
