[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-core"
version = "0.2.0"
description = "Self-hosted domain-agnostic multi-agent automation platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "httptools>=0.9.0",
    "websockets>=15.0",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[google,anthropic,openai,xai,openrouter,mcp]>=2.68.0",
    "valkey[libvalkey]>=6.2.0",
    "aiohttp>=3.14.5,<3.15.0",
    "aiofiles>=23.2.1,<26.0",
    "certifi>=2023.7.22",
    "magic-filter>=1.0.12,<1.1",
    "typing-extensions>=4.8.0",
    "google-auth-oauthlib>=1.5.0",
    "google-api-python-client>=2.202.0",
    "feedparser>=6.0.14",
    "trafilatura>=2.3.1",
    "lxml>=6.1.3",
    "apscheduler>=3.11.3,<4.0",
    "docker>=7.2.0",
    "cryptography>=50.0.2",
    "psutil>=7.2.2",
    "duckdb>=2.0.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.15.2",
    "Pillow>=13.0.0",
    "python-calamine>=0.9.1",
    "python-docx>=1.2.0",
    "asyncssh>=2.24.1",
    "zstandard>=0.23.0; python_version < '3.14'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"argo_core.db" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
